# Digital Investigation Platform - Spring Boot Configuration
spring.application.name=digital-investigation-backend

# Default active profile (dev uses embedded in-memory H2 with PostgreSQL compatibility mode)
# Switch to 'prod' when using a live PostgreSQL instance: spring.profiles.active=prod
spring.profiles.active=dev

# Server port
server.port=8080

# JSON serialization configuration
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Python AI Service Gateway URL
ai.service.base-url=http://localhost:8000/api/v1
